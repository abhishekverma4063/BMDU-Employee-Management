services:
  - type: web
    name: bmdu-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard (paste Railway URL)
      - key: CLIENT_URL
        sync: false   # set manually in Render dashboard (paste Vercel URL)
